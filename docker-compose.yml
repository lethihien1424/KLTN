services:
  postgres:
    image: postgres:16-alpine
    container_name: milano_postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - milano_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: milano_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - milano_network

volumes:
  postgres_data:

networks:
  milano_network:
    driver: bridge
